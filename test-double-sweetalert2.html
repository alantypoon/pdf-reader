<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SweetAlert2 Overlay Demo</title>
    <!-- Include SweetAlert2 CSS from CDN -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f4f7f6;
        }
        .btn {
            padding: 12px 24px;
            font-size: 16px;
            color: white;
            background-color: #3085d6;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .btn:hover {
            background-color: #2b76bc;
        }
        /* Custom styles for our nested overlay */
        .custom-sub-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.75);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
            border-radius: 5px; /* Matches SweetAlert default border-radius */
            animation: fadeIn 0.2s ease-out;
        }
        .overlay-content {
            background: #fff;
            padding: 24px;
            border-radius: 8px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            color: #333;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
    </style>
</head>
<body>

    <button class="btn" onclick="openSweetAlert()">Open Main Alert</button>

    <!-- Include SweetAlert2 JS from CDN -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script>
        function openSweetAlert() {
            Swal.fire({
                title: 'Main SweetAlert Window',
                text: 'This is the standard SweetAlert2 dialog base.',
                icon: 'info',
                showCancelButton: true,
                confirmButtonText: 'Inject Overlay',
                cancelButtonText: 'Close',
                // Ensure the main popup relative positioning context for absolute children
                didOpen: (popup) => {
                    popup.style.position = 'relative';
                },
                preConfirm: () => {
                    // Prevent closing the main alert immediately when clicking 'Inject Overlay'
                    showCustomOverlay();
                    return false; 
                }
            });
        }

        function showCustomOverlay() {
            const popup = Swal.getPopup();
            if (!popup) return;

            // Check if an overlay already exists to prevent duplicate injections
            if (document.getElementById('custom-sub-overlay')) return;

            // 1. Create the overlay container
            const subOverlay = document.createElement('div');
            subOverlay.id = 'custom-sub-overlay';
            subOverlay.className = 'custom-sub-overlay';
            
            // 2. Add inner HTML structure
            subOverlay.innerHTML = `
                <div class="overlay-content">
                    <h3 style="margin-top: 0;">Inner Overlay Dialog</h3>
                    <p>This layout sits safely inside the SweetAlert2 DOM tree.</p>
                    <button id="close-overlay-btn" class="swal2-confirm swal2-styled" style="background-color: #e11d48; margin-top: 10px;">
                        Close This Layer
                    </button>
                </div>
            `;

            // 3. Inject it straight into the SweetAlert2 popup DOM node
            popup.appendChild(subOverlay);

            // 4. Attach close listener to remove the overlay node safely
            document.getElementById('close-overlay-btn').addEventListener('click', () => {
                subOverlay.remove();
            });
        }
    </script>
</body>
</html>
